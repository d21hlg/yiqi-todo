<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7fcf91" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="一起Todo" />
  <title>一起 To Do</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header id="topbar">
    <div class="app-title">一起 To Do</div>
  </header>
  <main id="view"></main>
  <footer id="toolbar-slot"></footer>
  <nav id="tabbar">
    <a href="#/daily" data-tab="daily"><span class="tab-icon">📅</span>今日</a>
    <a href="#/cate" data-tab="cate"><span class="tab-icon">🗂</span>专题</a>
    <a href="#/groups" data-tab="groups"><span class="tab-icon">👥</span>群组</a>
    <a href="#/mine" data-tab="mine"><span class="tab-icon">👤</span>我的</a>
  </nav>
  <div id="toast" class="toast hide"></div>
  <div id="offline" class="offline-banner hide">离线中 · 数据保存在本地，联网后自动可用</div>
  <div id="boot-fallback" hidden style="max-width:520px;margin:40px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);text-align:center">
    <h2 style="margin:0 0 10px;font-size:18px">页面加载失败</h2>
    <p style="color:#666;font-size:13px;line-height:1.7">请检查网络后点「重新加载」。<br />若反复失败，点「清缓存并重装」会自动清除旧缓存后重试。</p>
    <pre id="boot-err" style="white-space:pre-wrap;color:#a33;font-size:11px;text-align:left;background:#fafafa;border-radius:8px;padding:8px;max-height:120px;overflow:auto"></pre>
    <button onclick="location.reload()" style="margin:4px;padding:10px 18px;border-radius:999px;border:1px solid #9dc4a4;background:#9dc4a4;color:#fff;font-size:14px">重新加载</button>
    <button onclick="(function(){try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}}catch(e){}setTimeout(function(){location.href=location.pathname+'?fresh='+Date.now();},400);})()" style="margin:4px;padding:10px 18px;border-radius:999px;border:1px solid #ccc;background:#fff;color:#555;font-size:14px">清缓存并重装</button>
  </div>
  <script>
    (function () {
      window.__bootErrs = [];
      window.addEventListener('error', function (e) { window.__bootErrs.push(e.message); });
      window.addEventListener('unhandledrejection', function (e) {
        window.__bootErrs.push(String((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (window.__booted) return;
        var el = document.getElementById('boot-fallback');
        if (!el) return;
        el.hidden = false;
        var legacy = !('noModule' in HTMLScriptElement.prototype);
        var msg = legacy ? '浏览器内核过旧，不支持本应用：请改用较新的 Chrome / Safari / Edge 打开' : ((window.__bootErrs || []).join(' | ') || '(无错误信息，可能网络未加载到脚本)');
        document.getElementById('boot-err').textContent = msg;
        console.error('[Boot] app not booted:', msg);
      }, 8000);
    })();
  </script>
  <script nomodule>
    window.__bootErrs = window.__bootErrs || [];
    window.__bootErrs.push('nomodule: 浏览器不支持 ES Module');
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
